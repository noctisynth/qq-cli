name: Quality

on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: pwsh

jobs:
  test:
    name: Windows Rust
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Activate repository Rust toolchain
        run: rustup show active-toolchain
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-x64
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Setup Semifold
        uses: noctisynth/setup-semifold@main
      - name: Remove setup installer
        run: |
          if (git ls-files -- install.ps1) { throw 'Refusing to remove a tracked installer.' }
          if (Test-Path -LiteralPath ./install.ps1) { Remove-Item -LiteralPath ./install.ps1 }
      - name: Check package discovery
        run: semifold config sync --check
      - name: Offline quality gates
        run: ./scripts/check.ps1
      - name: Package Windows CLI
        run: ./scripts/package-release.ps1
      - name: Retain checked distribution
        uses: actions/upload-artifact@v4
        with:
          name: qq-cli-windows-${{ github.sha }}
          path: |
            artifacts/qq-cli-*-windows-x86_64.zip
            artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
  macos:
    name: macOS arm64 Rust
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Require native Apple Silicon
        run: test "$(uname -m)" = arm64
      - name: Diagnose synthetic copy metadata
        run: |
          python3 - <<'PYTHON'
          import ctypes, hashlib, os, pathlib, subprocess, tempfile
          sdk = ctypes.CDLL('/usr/lib/libSystem.B.dylib', use_errno=True)
          sdk.fcopyfile.argtypes = [ctypes.c_int, ctypes.c_int, ctypes.c_void_p, ctypes.c_uint32]
          sdk.fcopyfile.restype = ctypes.c_int
          sdk.setxattr.argtypes = [ctypes.c_char_p, ctypes.c_char_p, ctypes.c_void_p, ctypes.c_size_t, ctypes.c_uint32, ctypes.c_int]
          sdk.listxattr.argtypes = [ctypes.c_char_p, ctypes.c_void_p, ctypes.c_size_t, ctypes.c_int]
          sdk.getxattr.argtypes = [ctypes.c_char_p, ctypes.c_char_p, ctypes.c_void_p, ctypes.c_size_t, ctypes.c_uint32, ctypes.c_int]
          sdk.listxattr.restype = sdk.getxattr.restype = ctypes.c_ssize_t
          def set_attribute(path, name, value):
              assert sdk.setxattr(os.fsencode(path), name.encode(), value, len(value), 0, 0) == 0
          def attributes_of(path):
              path = os.fsencode(path)
              names = ctypes.create_string_buffer(65536)
              length = sdk.listxattr(path, names, len(names), 0)
              assert length >= 0
              result = {}
              for name in names.raw[:length].split(b'\0')[:-1]:
                  value = ctypes.create_string_buffer(65536)
                  size = sdk.getxattr(path, name, value, len(value), 0, 0)
                  assert size >= 0
                  result[name.decode()] = (size, hashlib.sha256(value.raw[:size]).hexdigest())
              return result
          with tempfile.TemporaryDirectory() as temporary:
              base = pathlib.Path(temporary)
              source = base / 'Source.app'
              source.mkdir()
              file = source / 'synthetic'
              file.write_bytes(b'synthetic data')
              attributes = {'com.apple.ResourceFork': b'synthetic fork',
                            'com.apple.quarantine': b'0083;00000000;qq-cli-test;',
                            'org.qq-cli.empty': b''}
              for name, value in attributes.items():
                  set_attribute(file, name, value)
              set_attribute(source, 'org.qq-cli.synthetic', b'directory attribute')
              copied = base / 'Copy.app'
              subprocess.run(['/usr/bin/ditto', '--rsrc', '--extattr', '--qtn', '--acl', str(source), str(copied)], check=True)
              native = base / 'native'
              with file.open('rb') as original, native.open('w+b') as destination:
                  result = sdk.fcopyfile(original.fileno(), destination.fileno(), None, 15)
                  print('fcopyfile result/errno:', result, ctypes.get_errno())
              for label, path in [('source root', source), ('ditto root', copied), ('source file', file), ('ditto file', copied / 'synthetic'), ('native file', native)]:
                  print(label, attributes_of(path))
          PYTHON
      - name: Activate repository Rust toolchain
        run: rustup show active-toolchain
      - name: Setup adapter test runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-arm64
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Offline native quality gates
        run: ./scripts/check-macos.sh
      - name: Package macOS CLI
        run: ./scripts/package-macos.sh
      - name: Retain checked distribution
        uses: actions/upload-artifact@v4
        with:
          name: qq-cli-macos-arm64-${{ github.sha }}
          path: |
            artifacts/macos/qq-cli-*-macos-aarch64.zip
            artifacts/macos/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
