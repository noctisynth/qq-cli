[package]
name = "qq-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
description = "An agent-friendly command-line client for an existing NapCat instance"
publish = false
include = ["/src/**", "/tests/**", "/scripts/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/CONTRIBUTING.md", "/docs/**", "/rust-toolchain.toml"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[lints.rust]
unsafe_code = "forbid"
