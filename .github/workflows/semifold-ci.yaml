name: Semifold CI

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: semifold-main
  cancel-in-progress: false

jobs:
  quality:
    name: Quality
    uses: ./.github/workflows/quality.yaml
  release:
    name: Version or publish
    needs: quality
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    outputs:
      version: ${{ steps.semifold.outputs['semifold-version'] }}
      publish: ${{ steps.semifold.outputs['semifold-publish'] }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.SEMIFOLD_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Activate repository Rust toolchain
        run: rustup show active-toolchain
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-x64
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Setup Semifold
        uses: noctisynth/setup-semifold@main
      - name: Remove setup installer
        run: |
          if (git ls-files -- install.ps1) { throw 'Refusing to remove a tracked installer.' }
          if (Test-Path -LiteralPath ./install.ps1) { Remove-Item -LiteralPath ./install.ps1 }
      - name: Download checked Windows package
        uses: actions/download-artifact@v4
        with:
          name: qq-cli-windows-${{ github.sha }}
          path: artifacts/windows
      - name: Download checked macOS package
        uses: actions/download-artifact@v4
        with:
          name: qq-cli-macos-arm64-${{ github.sha }}
          path: artifacts/macos
      - name: Setup release asset collector
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare release assets
        run: |
          $metadata = & cargo metadata --offline --locked --no-deps --format-version 1
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read locked Cargo package metadata.' }
          $packages = @((($metadata | ConvertFrom-Json).packages) | Where-Object name -EQ 'qq-cli')
          if ($packages.Count -ne 1) { throw 'Expected one qq-cli package.' }
          python scripts/release_assets.py --version $packages[0].version --windows artifacts/windows --macos artifacts/macos --output artifacts
          if ($LASTEXITCODE -ne 0) { throw 'Release asset collection failed.' }
      - name: Verify clean release workspace
        run: |
          $changes = git status --porcelain
          if ($LASTEXITCODE -ne 0 -or $changes) { throw 'Release workspace has unexpected changes before Semifold.' }
      - name: Semifold CI
        id: semifold
        run: semifold ci
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          CLICOLOR_FORCE: 1
          GITHUB_TOKEN: ${{ secrets.SEMIFOLD_TOKEN || secrets.GITHUB_TOKEN }}
